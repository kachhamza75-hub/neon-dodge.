name: Build Neon Dodge APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Prepare package.json and install dependencies
        run: |
          if [ ! -f "package.json" ]; then
            cat <<'EOF' > package.json
          {
            "name": "neon-dodge",
            "version": "1.0.0",
            "description": "Neon Dodge Android Game",
            "scripts": {
              "cap:sync": "npx cap sync android"
            },
            "dependencies": {
              "@capacitor/core": "^6.0.0",
              "@capacitor/android": "^6.0.0",
              "@capacitor-community/admob": "^6.0.0"
            }
          }
          EOF
          fi
          npm install

      - name: Ensure www/index.html and Capacitor Android setup
        run: |
          mkdir -p www
          if [ ! -f "www/index.html" ]; then
            echo "<h1>Neon Dodge</h1>" > www/index.html
          fi
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            cat <<'EOF' > capacitor.config.json
          {
            "appId": "com.kachhamza75.neondodge",
            "appName": "Neon Dodge",
            "webDir": "www"
          }
          EOF
          fi
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure AdMob App ID in Android project
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          const admobAppId = "ca-app-pub-9252965845144085~9905485493";
          const stringsPath = path.join("android", "app", "src", "main", "res", "values", "strings.xml");
          const manifestPath = path.join("android", "app", "src", "main", "AndroidManifest.xml");

          if (fs.existsSync(stringsPath)) {
            let stringsXml = fs.readFileSync(stringsPath, "utf8");
            if (stringsXml.includes("admob_app_id")) {
              stringsXml = stringsXml.replace(
                /<string name="admob_app_id">.*?<\/string>/s,
                `<string name="admob_app_id">${admobAppId}</string>`
              );
            } else {
              stringsXml = stringsXml.replace(
                /<\/resources>/,
                `    <string name="admob_app_id">${admobAppId}</string>\n</resources>`
              );
            }
            fs.writeFileSync(stringsPath, stringsXml, "utf8");
          }

          if (fs.existsSync(manifestPath)) {
            let manifestXml = fs.readFileSync(manifestPath, "utf8");
            const metaTag = `        <meta-data\n            android:name="com.google.android.gms.ads.APPLICATION_ID"\n            android:value="@string/admob_app_id" />`;

            if (manifestXml.includes("com.google.android.gms.ads.APPLICATION_ID")) {
              manifestXml = manifestXml.replace(
                /<meta-data\s+android:name="com.google.android.gms.ads.APPLICATION_ID"[\s\S]*?\/>/g,
                metaTag.trim()
              );
            } else {
              manifestXml = manifestXml.replace(
                /(<application\b[^>]*>)/,
                `$1\n${metaTag}`
              );
            }
            fs.writeFileSync(manifestXml, manifestXml, "utf8");
          }
          '

      - name: Build Debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon-dodge-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
