name: Build Neon Dodge APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Prepare package.json and install dependencies
        run: |
          if [ ! -f "package.json" ]; then
            cat <<'EOF' > package.json
          {
            "name": "neon-dodge",
            "version": "1.0.0",
            "description": "Neon Dodge Android Game",
            "scripts": {
              "cap:sync": "cap sync android"
            },
            "dependencies": {
              "@capacitor/core": "^6.0.0",
              "@capacitor/android": "^6.0.0",
              "@capacitor-community/admob": "^6.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^6.0.0"
            }
          }
          EOF
          fi
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund @capacitor/cli@^6.0.0 @capacitor/core@^6.0.0 @capacitor/android@^6.0.0 @capacitor-community/admob@^6.0.0

      - name: Ensure www/index.html and Capacitor Android setup
        run: |
          mkdir -p www
          if [ ! -f "www/index.html" ]; then
            echo "<h1>Neon Dodge</h1>" > www/index.html
          fi
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            cat <<'EOF' > capacitor.config.json
          {
            "appId": "com.kachhamza75.neondodge",
            "appName": "Neon Dodge",
            "webDir": "www"
          }
          EOF
          fi
          CAP_BIN="./node_modules/.bin/cap"
          if [ ! -f "$CAP_BIN" ]; then
            echo "Capacitor CLI binary not found at $CAP_BIN"
            ls -la node_modules/.bin || true
            exit 1
          fi
          if [ ! -d "android" ]; then
            "$CAP_BIN" add android
          fi
          "$CAP_BIN" sync android

      - name: Configure AdMob App ID in Android project
        run: |
          node <<'EOF'
          const fs = require("fs");
          const path = require("path");

          const admobAppId = "ca-app-pub-9252965845144085~9905485493";

          function findFiles(dir, targetName, results = []) {
            if (!fs.existsSync(dir)) return results;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const fullPath = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                findFiles(fullPath, targetName, results);
              } else if (entry.name === targetName) {
                results.push(fullPath);
              }
            }
            return results;
          }

          const stringsFiles = findFiles("android", "strings.xml");
          for (const stringsPath of stringsFiles) {
            let stringsXml = fs.readFileSync(stringsPath, "utf8");
            if (stringsXml.includes("admob_app_id")) {
              stringsXml = stringsXml.replace(
                /<string name="admob_app_id">[\s\S]*?<\/string>/,
                `<string name="admob_app_id">${admobAppId}</string>`
              );
            } else if (stringsXml.includes("</resources>")) {
              stringsXml = stringsXml.replace(
                /<\/resources>/,
                `    <string name="admob_app_id">${admobAppId}</string>\n</resources>`
              );
            }
            fs.writeFileSync(stringsPath, stringsXml, "utf8");
          }

          let manifestFiles = findFiles("android", "AndroidManifest.xml");
          if (manifestFiles.length === 0) {
            const fallbackManifest = path.join("android", "app", "src", "main", "AndroidManifest.xml");
            fs.mkdirSync(path.dirname(fallbackManifest), { recursive: true });
            fs.writeFileSync(
              fallbackManifest,
              `<?xml version="1.0" encoding="utf-8"?>\n<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <application\n        android:allowBackup="true"\n        android:label="@string/app_name"\n        android:supportsRtl="true"\n        android:theme="@style/AppTheme">\n        <meta-data\n            android:name="com.google.android.gms.ads.APPLICATION_ID"\n            android:value="${admobAppId}" />\n    </application>\n    <uses-permission android:name="android.permission.INTERNET" />\n</manifest>\n`,
              "utf8"
            );
            manifestFiles = [fallbackManifest];
          }

          for (const manifestPath of manifestFiles) {
            let manifestXml = fs.readFileSync(manifestPath, "utf8");
            const metaTag = `        <meta-data\n            android:name="com.google.android.gms.ads.APPLICATION_ID"\n            android:value="${admobAppId}" />`;

            if (manifestXml.includes("com.google.android.gms.ads.APPLICATION_ID")) {
              manifestXml = manifestXml.replace(
                /<meta-data\s+android:name="com.google.android.gms.ads.APPLICATION_ID"[\s\S]*?\/>/g,
                metaTag.trim()
              );
            } else if (/<application\b[^>]*>/.test(manifestXml)) {
              manifestXml = manifestXml.replace(
                /(<application\b[^>]*>)/,
                `$1\n${metaTag}`
              );
            }
            fs.writeFileSync(manifestPath, manifestXml, "utf8");
          }
          EOF

      - name: Build Debug APK
        run: |
          GRADLEW_FILE=$(find android -maxdepth 3 -name "gradlew" | head -n 1)
          if [ -z "$GRADLEW_FILE" ]; then
            echo "gradlew not found inside android directory"
            exit 1
          fi
          GRADLE_DIR=$(dirname "$GRADLEW_FILE")
          chmod +x "$GRADLEW_FILE"
          (cd "$GRADLE_DIR" && ./gradlew assembleDebug)

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon-dodge-apk
          path: android/**/build/outputs/apk/debug/app-debug.apk
          
