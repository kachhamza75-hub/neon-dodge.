name: Build Neon Dodge APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare web directory
        run: |
          mkdir -p www
          if [ -f "index.html" ] && [ ! -f "www/index.html" ]; then
            cp index.html www/index.html
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor and AdMob plugin
        run: |
          cat << 'EOF' > package.json
          {
            "name": "neon-dodge",
            "version": "1.0.0",
            "description": "Neon Dodge mobile game",
            "main": "index.js",
            "license": "MIT"
          }
          EOF
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest @capacitor-community/admob@latest
          npx cap init "Neon Dodge" "com.hamza.neondodge" --web-dir=www
          npx cap add android

      - name: Configure AdMob App ID for testing
        run: |
          STRINGS_FILE="android/app/src/main/res/values/strings.xml"
          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
          TEST_APP_ID="ca-app-pub-3940256099942544~3347511713"

          if [ -f "$STRINGS_FILE" ] && ! grep -q "admob_app_id" "$STRINGS_FILE"; then
            sed -i "s|</resources>|    <string name=\"admob_app_id\">${TEST_APP_ID}</string>\n</resources>|" "$STRINGS_FILE"
          fi

          if [ -f "$MANIFEST_FILE" ] && ! grep -q "com.google.android.gms.ads.APPLICATION_ID" "$MANIFEST_FILE"; then
            sed -i 's|</application>|        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="@string/admob_app_id" />\n    </application>|' "$MANIFEST_FILE"
          fi

          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon-dodge-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
