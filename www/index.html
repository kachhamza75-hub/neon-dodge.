<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Neon Dodge</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background-color: #07050f;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
    }

    #gameWrapper {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100%;
      background: radial-gradient(circle at top, #1b0d38 0%, #090614 65%, #05030a 100%);
      border-left: 1px solid rgba(168, 85, 247, 0.3);
      border-right: 1px solid rgba(168, 85, 247, 0.3);
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #hud {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 5;
    }

    .hud-box {
      background: rgba(18, 10, 36, 0.82);
      border: 1px solid #9333ea;
      box-shadow: 0 0 12px rgba(168, 85, 247, 0.45);
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: bold;
      color: #f3e8ff;
    }

    .hud-box span {
      color: #c084fc;
      font-size: 17px;
      margin-right: 4px;
    }

    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(6, 4, 14, 0.86);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      z-index: 10;
    }

    #overlay.hidden {
      display: none;
    }

    .neon-title {
      font-size: 36px;
      font-weight: 900;
      color: #f5ebff;
      text-shadow: 0 0 10px #a855f7, 0 0 24px #7e22ce;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    .subtitle {
      color: #d8b4fe;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .score-summary {
      background: rgba(24, 12, 50, 0.9);
      border: 1px solid rgba(192, 132, 252, 0.45);
      border-radius: 14px;
      padding: 12px 20px;
      margin-bottom: 20px;
      width: 100%;
      max-width: 300px;
      font-size: 15px;
    }

    .btn {
      width: 100%;
      max-width: 300px;
      padding: 14px 18px;
      margin: 6px 0;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.15s ease;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: linear-gradient(135deg, #9333ea, #6b21a8);
      color: #ffffff;
      box-shadow: 0 0 18px rgba(168, 85, 247, 0.65);
    }

    .btn-reward {
      background: linear-gradient(135deg, #c026d3, #7e22ce);
      color: #ffffff;
      box-shadow: 0 0 16px rgba(217, 70, 239, 0.55);
    }

    #adStatus {
      margin-top: 12px;
      font-size: 12px;
      color: #c084fc;
      min-height: 18px;
    }

    #webBannerFallback {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 50px;
      background: rgba(15, 8, 30, 0.92);
      border-top: 1px solid rgba(168, 85, 247, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #a855f7;
      z-index: 6;
    }
  </style>
</head>

    <div id="hud">
      <div class="hud-box">النقاط: <span id="scoreVal">0</span></div>
      <div class="hud-box">الأفضل: <span id="bestVal">0</span></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="overlay">
      <div class="neon-title">NEON DODGE</div>
      <div class="subtitle">اسحب أو المس اليمين واليسار لتفادي الكتل النيونية</div>

      <div class="score-summary" id="scoreSummary" style="display: none;">
        <div>نقاط الجولة: <strong id="finalScore">0</strong></div>
        <div>أعلى نتيجة: <strong id="finalBest">0</strong></div>
      </div>

      <button class="btn btn-primary" id="startBtn">ابدأ اللعب</button>
      <button class="btn btn-reward" id="rewardBtn" style="display: none;">شاهد إعلاناً واستمر (مرة واحدة)</button>
      <div id="adStatus">جاري تجهيز الإعلانات...</div>
    </div>

    <div id="webBannerFallback">AdMob Banner Area</div>
  </div>
