<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Neon Dodge</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background-color: #07050f;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
    }

    #gameWrapper {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100%;
      background: radial-gradient(circle at top, #1b0d38 0%, #090614 65%, #05030a 100%);
      border-left: 1px solid rgba(168, 85, 247, 0.3);
      border-right: 1px solid rgba(168, 85, 247, 0.3);
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #hud {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 5;
    }

    .hud-box {
      background: rgba(18, 10, 36, 0.82);
      border: 1px solid #9333ea;
      box-shadow: 0 0 12px rgba(168, 85, 247, 0.45);
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: bold;
      color: #f3e8ff;
    }

    .hud-box span {
      color: #c084fc;
      font-size: 17px;
      margin-right: 4px;
    }

    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(6, 4, 14, 0.86);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      z-index: 10;
    }

    #overlay.hidden {
      display: none;
    }

    .neon-title {
      font-size: 36px;
      font-weight: 900;
      color: #f5ebff;
      text-shadow: 0 0 10px #a855f7, 0 0 24px #7e22ce;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    .subtitle {
      color: #d8b4fe;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .score-summary {
      background: rgba(24, 12, 50, 0.9);
      border: 1px solid rgba(192, 132, 252, 0.45);
      border-radius: 14px;
      padding: 12px 20px;
      margin-bottom: 20px;
      width: 100%;
      max-width: 300px;
      font-size: 15px;
    }

    .btn {
      width: 100%;
      max-width: 300px;
      padding: 14px 18px;
      margin: 6px 0;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.15s ease;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: linear-gradient(135deg, #9333ea, #6b21a8);
      color: #ffffff;
      box-shadow: 0 0 18px rgba(168, 85, 247, 0.65);
    }

    .btn-reward {
      background: linear-gradient(135deg, #c026d3, #7e22ce);
      color: #ffffff;
      box-shadow: 0 0 16px rgba(217, 70, 239, 0.55);
    }

    #adStatus {
      margin-top: 12px;
      font-size: 12px;
      color: #c084fc;
      min-height: 18px;
    }

    /* مساحة احتياطية للبانر على المتصفح فقط؛ على أندرويد يعرض AdMob البانر الأصلي */
    #webBannerFallback {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 50px;
      background: rgba(15, 8, 30, 0.92);
      border-top: 1px solid rgba(168, 85, 247, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #a855f7;
      z-index: 6;
    }
  </style>
</head>
<body>
  <div id="gameWrapper">
    <div id="hud">
      <div class="hud-box">النقاط: <span id="scoreVal">0</span></div>
      <div class="hud-box">الأفضل: <span id="bestVal">0</span></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="overlay">
      <div class="neon-title">NEON DODGE</div>
      <div class="subtitle">اسحب أو المس اليمين واليسار لتفادي الكتل النيونية</div>

      <div class="score-summary" id="scoreSummary" style="display: none;">
        <div>نقاط الجولة: <strong id="finalScore">0</strong></div>
        <div>أعلى نتيجة: <strong id="finalBest">0</strong></div>
      </div>

      <button class="btn btn-primary" id="startBtn">ابدأ اللعب</button>
      <button class="btn btn-reward" id="rewardBtn" style="display: none;">شاهد إعلاناً واستمر (مرة واحدة)</button>
      <div id="adStatus">جاري تجهيز الإعلانات...</div>
    </div>

    <div id="webBannerFallback">AdMob Banner Area (Test Mode)</div>
  </div>

  <script>
    // ==========================================
    // إعدادات AdMob (معرّفات الاختبار الرسمية)
    // استبدلها بمعرّفاتك الحقيقية عند النشر واجعل IS_TESTING = false
    // ==========================================
    const ADMOB_CONFIG = {
      IS_TESTING: true,
      BANNER_AD_ID: 'ca-app-pub-3940256099942544/6300978111',
      REWARDED_AD_ID: 'ca-app-pub-3940256099942544/5224354917'
    };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('scoreVal');
    const bestEl = document.getElementById('bestVal');
    const overlayEl = document.getElementById('overlay');
    const scoreSummaryEl = document.getElementById('scoreSummary');
    const finalScoreEl = document.getElementById('finalScore');
    const finalBestEl = document.getElementById('finalBest');
    const startBtn = document.getElementById('startBtn');
    const rewardBtn = document.getElementById('rewardBtn');
    const adStatusEl = document.getElementById('adStatus');
    const webBannerEl = document.getElementById('webBannerFallback');

    let audioCtx = null;
    function playTone(freq, duration = 0.08, type = 'sine') {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.value = 0.08;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (_) {}
    }

    let width = 0;
    let height = 0;
    function resizeCanvas() {
      const rect = document.getElementById('gameWrapper').getBoundingClientRect();
      width = canvas.width = rect.width;
      height = canvas.height = rect.height;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let bestScore = Number(localStorage.getItem('neon_dodge_best') || 0);
    bestEl.textContent = bestScore;

    let gameState = 'menu'; // 'menu' | 'playing' | 'gameover'
    let score = 0;
    let usedRewardThisRun = false;
    let obstacles = [];
    let spawnTimer = 0;
    let animId = null;

    const player = {
      x: 0,
      y: 0,
      size: 34,
      targetX: 0,
      speed: 10
    };

    function resetPlayerPosition() {
      player.x = width / 2 - player.size / 2;
      player.targetX = player.x;
      player.y = height - 110;
    }
    resetPlayerPosition();

    function handlePointerMove(clientX) {
      if (gameState !== 'playing') return;
      const rect = canvas.getBoundingClientRect();
      const relX = clientX - rect.left;
      player.targetX = Math.max(12, Math.min(width - player.size - 12, relX - player.size / 2));
    }

    canvas.addEventListener('touchstart', (e) => {
      if (e.touches[0]) handlePointerMove(e.touches[0].clientX);
    }, { passive: true });

    canvas.addEventListener('touchmove', (e) => {
      if (e.touches[0]) handlePointerMove(e.touches[0].clientX);
    }, { passive: true });

    canvas.addEventListener('mousemove', (e) => {
      if (e.buttons === 1) handlePointerMove(e.clientX);
    });

    // ==========================================
    // تكامل @capacitor-community/admob
    // ==========================================
    function getAdMobPlugin() {
      return window.Capacitor &&
             window.Capacitor.isNativePlatform &&
             window.Capacitor.isNativePlatform() &&
             window.Capacitor.Plugins &&
             window.Capacitor.Plugins.AdMob
        ? window.Capacitor.Plugins.AdMob
        : null;
    }

    let isAdMobReady = false;
    let isRewardedLoaded = false;

    async function initAdMobAndAds() {
      const AdMob = getAdMobPlugin();
      if (!AdMob) {
        adStatusEl.textContent = 'وضع المعاينة على الويب (الإعلانات الأصلية تعمل داخل تطبيق أندرويد)';
        return;
      }

      webBannerEl.style.display = 'none';

      try {
        await AdMob.initialize({
          testingDevices: [],
          initializeForTesting: ADMOB_CONFIG.IS_TESTING
        });
        isAdMobReady = true;

        await AdMob.showBanner({
          adId: ADMOB_CONFIG.BANNER_AD_ID,
          adSize: 'BANNER',
          position: 'BOTTOM_CENTER',
          margin: 0,
          isTesting: ADMOB_CONFIG.IS_TESTING
        });

        await prepareRewardedAd();
      } catch (err) {
        adStatusEl.textContent = 'تعذر تهيئة الإعلانات حالياً';
      }
    }

    async function prepareRewardedAd() {
      const AdMob = getAdMobPlugin();
      if (!AdMob || !isAdMobReady) return;
      try {
        isRewardedLoaded = false;
        await AdMob.prepareRewardVideoAd({
          adId: ADMOB_CONFIG.REWARDED_AD_ID,
          isTesting: ADMOB_CONFIG.IS_TESTING
        });
        isRewardedLoaded = true;
        adStatusEl.textContent = 'إعلان المكافأة جاهز';
      } catch (_) {
        isRewardedLoaded = false;
        adStatusEl.textContent = 'جاري إعادة تحميل إعلان المكافأة...';
      }
    }

    async function showRewardedAdForContinue() {
      const AdMob = getAdMobPlugin();
      rewardBtn.disabled = true;

      if (!AdMob) {
        // محاكاة مشاهدة الإعلان على المتصفح فقط
        adStatusEl.textContent = 'تم منح متابعة تجريبية (وضع المتصفح)';
        continueAfterReward();
        return;
      }

      try {
        if (!isRewardedLoaded) {
          await prepareRewardedAd();
        }
        const rewardResult = await AdMob.showRewardVideoAd();
        if (rewardResult) {
          continueAfterReward();
          await prepareRewardedAd();
        } else {
          rewardBtn.disabled = false;
          adStatusEl.textContent = 'لم يكتمل الإعلان';
        }
      } catch (_) {
        rewardBtn.disabled = false;
        adStatusEl.textContent = 'تعذر عرض الإعلان الآن، حاول مجدداً';
        prepareRewardedAd();
      }
    }

    function continueAfterReward() {
      usedRewardThisRun = true;
      // إبعاد الكتل القريبة لإعطاء اللاعب فرصة آمنة
      obstacles = obstacles.filter(obs => obs.y < player.y - 220);
      gameState = 'playing';
      overlayEl.classList.add('hidden');
      playTone(660, 0.14, 'triangle');
      loop();
    }

    function startNewGame() {
      score = 0;
      usedRewardThisRun = false;
      obstacles = [];
      spawnTimer = 0;
      scoreEl.textContent = '0';
      resetPlayerPosition();
      gameState = 'playing';
      overlayEl.classList.add('hidden');
      playTone(520, 0.1, 'sine');
      if (animId) cancelAnimationFrame(animId);
      loop();
    }

    function triggerGameOver() {
      gameState = 'gameover';
      if (animId) cancelAnimationFrame(animId);
      playTone(170, 0.25, 'sawtooth');

      const currentScore = Math.floor(score);
      if (currentScore > bestScore) {
        bestScore = currentScore;
        localStorage.setItem('neon_dodge_best', String(bestScore));
      }

      bestEl.textContent = bestScore;
      finalScoreEl.textContent = currentScore;
      finalBestEl.textContent = bestScore;
      scoreSummaryEl.style.display = 'block';
      startBtn.textContent = 'لعب من جديد';

      if (!usedRewardThisRun) {
        rewardBtn.style.display = 'block';
        rewardBtn.disabled = false;
      } else {
        rewardBtn.style.display = 'none';
      }

      overlayEl.classList.remove('hidden');
    }

    function spawnObstacle() {
      const minW = 42;
      const maxW = Math.min(130, width * 0.34);
      const w = minW + Math.random() * (maxW - minW);
      const x = 12 + Math.random() * Math.max(20, width - w - 24);
      const speed = 3.4 + Math.min(6.5, score * 0.04) + Math.random() * 1.4;
      obstacles.push({
        x,
        y: -26,
        w,
        h: 22,
        speed
      });
    }

    function update() {
      score += 0.08;
      scoreEl.textContent = Math.floor(score);

      player.x += (player.targetX - player.x) * 0.25;

      spawnTimer++;
      const spawnInterval = Math.max(24, 52 - Math.floor(score * 0.22));
      if (spawnTimer >= spawnInterval) {
        spawnTimer = 0;
        spawnObstacle();
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.y += obs.speed;

        // فحص التصادم
        const hit =
          player.x < obs.x + obs.w - 4 &&
          player.x + player.size > obs.x + 4 &&
          player.y < obs.y + obs.h - 4 &&
          player.y + player.size > obs.y + 4;

        if (hit) {
          triggerGameOver();
          return;
        }

        if (obs.y > height + 40) {
          obstacles.splice(i, 1);
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);

      // شبكة نيون خفيفة
      ctx.strokeStyle = 'rgba(168, 85, 247, 0.08)';
      ctx.lineWidth = 1;
      for (let gx = 0; gx < width; gx += 40) {
        ctx.beginPath();
        ctx.moveTo(gx, 0);
        ctx.lineTo(gx, height);
        ctx.stroke();
      }

      // رسم اللاعب
      ctx.save();
      ctx.shadowColor = '#c084fc';
      ctx.shadowBlur = 18;
      ctx.fillStyle = '#e9d5ff';
      ctx.beginPath();
      ctx.roundRect(player.x, player.y, player.size, player.size, 8);
      ctx.fill();
      ctx.restore();

      // رسم الكتل النيونية
      for (const obs of obstacles) {
        ctx.save();
        ctx.shadowColor = '#d946ef';
        ctx.shadowBlur = 14;
        ctx.fillStyle = '#a855f7';
        ctx.beginPath();
        ctx.roundRect(obs.x, obs.y, obs.w, obs.h, 6);
        ctx.fill();
        ctx.restore();
      }
    }

    function loop() {
      if (gameState !== 'playing') return;
      update();
      draw();
      animId = requestAnimationFrame(loop);
    }

    startBtn.addEventListener('click', startNewGame);
    rewardBtn.addEventListener('click', showRewardedAdForContinue);

    document.addEventListener('DOMContentLoaded', () => {
      draw();
      initAdMobAndAds();
    });
  </script>
</body>
  </html>
